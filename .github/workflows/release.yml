name: Build WIC Codec

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 package
    runs-on: windows-2022

    env:
      BUILD_DIR: ${{ github.workspace }}\wic\build
      CLI_BUILD_DIR: ${{ github.workspace }}\cli\build
      PACKAGE_DIR: ${{ github.workspace }}\artifacts\PepWicCodec
      ZIP_PATH: ${{ github.workspace }}\artifacts\PepWicCodec-win-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        shell: pwsh
        run: cmake -S "$env:GITHUB_WORKSPACE\wic" -B "$env:BUILD_DIR" -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --config Release --parallel

      - name: Configure command-line tool
        shell: pwsh
        run: cmake -S "$env:GITHUB_WORKSPACE\cli" -B "$env:CLI_BUILD_DIR" -G "Visual Studio 17 2022" -A x64

      - name: Build command-line tool
        shell: pwsh
        run: cmake --build "$env:CLI_BUILD_DIR" --config Release --parallel

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "1.0.0"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(.+)$') {
            $version = $Matches[1]
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "$env:GITHUB_WORKSPACE\installer\PepWicCodec.iss" `
            "/DAppVersion=$version" `
            "/DSourceDir=$env:BUILD_DIR\Release" `
            "/DCliSourceDir=$env:CLI_BUILD_DIR\Release" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts"

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Path $env:PACKAGE_DIR -Force | Out-Null

          Copy-Item -LiteralPath "$env:BUILD_DIR\Release\PepWicCodec.dll" -Destination "$env:PACKAGE_DIR\PepWicCodec.dll"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\installer\register.ps1" -Destination "$env:PACKAGE_DIR\register.ps1"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\installer\unregister.ps1" -Destination "$env:PACKAGE_DIR\unregister.ps1"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\README.md" -Destination "$env:PACKAGE_DIR\README.md"

          Compress-Archive -Path "$env:PACKAGE_DIR\*" -DestinationPath "$env:ZIP_PATH" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: PepWicCodec-win-x64
          path: |
            ${{ github.workspace }}\artifacts\PepWicCodec-win-x64.zip
            ${{ github.workspace }}\artifacts\PepWicCodecSetup-win-x64.exe
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            ${{ github.workspace }}\artifacts\PepWicCodec-win-x64.zip
            ${{ github.workspace }}\artifacts\PepWicCodecSetup-win-x64.exe
